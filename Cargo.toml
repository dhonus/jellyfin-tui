[workspace]
members = [".", "crates/media-controls"]
resolver = "2"

[workspace.dependencies]
log = "0.4.35"
tokio = "1.54.1"

[package]
name = "jellyfin-tui"
version = "1.6.1"
edition = "2021"

[features]
default = ["tls-native"]
tls-native = [
    "reqwest/native-tls",
    "tokio-tungstenite/native-tls"
]
tls-rustls = [
    "reqwest/rustls",
    "tokio-tungstenite/rustls-tls-webpki-roots"
]

[dependencies]
arboard = "3.7.0"
chrono = "0.4.45"
color-thief = "0.2.2"
crokey = { version = "1.5.1", features = ["serde"] }
crossterm = "0.29.0"
dialoguer = "0.12.0"
dirs = "7.0.0"
discord-rich-presence = "1.1.0"
flexi_logger = "0.31.10"
fs2 = "0.4.3"
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
indexmap = { version = "2.14.2", features = ["serde"] }
keyring = "4.2.0"
libmpv2 = "7.0.0"
log.workspace = true
media-controls = { path = "crates/media-controls" }
rand = "0.10.3"
random-string = "1.1.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "serde"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "http2", "json", "query", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
strum = { version = "0.28.0", features = ["derive"] }
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
unicode-normalization = "0.1.26"
unicode-truncate = "3.0.0"
url = "2.5.8"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(cargo_clippy)'
] }
